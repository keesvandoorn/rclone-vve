<h1>Rclone VvE</h1>
<p>Rclone VvE synchroniseert bestanden tussen de Google Drive van de VvE
en een afgeschermde map op de NAS. De koppeling vraagt lees- en
schrijfrechten om wijzigingen in beide richtingen te verwerken.</p>
